services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ""
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - asaya

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - asaya

networks:
  asaya:

volumes:
  caddy_data:
  caddy_config:
