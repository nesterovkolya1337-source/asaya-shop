server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  location = /legal/cookies { return 301 /legal/privacy/; }
  location = /legal/cookies/ { return 301 /legal/privacy/; }
  location = /offer { return 301 /legal/offer/; }
  location = /offer/ { return 301 /legal/offer/; }
  location = /payment { return 301 /delivery/; }
  location = /payment/ { return 301 /delivery/; }
  location = /return { return 301 /returns/; }
  location = /return/ { return 301 /returns/; }
  location = /order-status { return 301 "/account/#orders"; }
  location = /order-status/ { return 301 "/account/#orders"; }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /_next/static/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }
}
